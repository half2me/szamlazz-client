name: Live API tests

# Issues and reverses real documents on szamlazz.hu's demo account, so it stays
# off the pull-request path: it runs after a merge, nightly (to notice when
# szamlazz.hu changes under us), and on demand.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: live-api
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:live
