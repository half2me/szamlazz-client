name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The test suite hits the shared szamlazz.hu demo account, which rejects concurrent
# invoice creation (error 468). Serialize CI runs so ours don't collide with each other;
# a run already in progress is left to finish. Publish deliberately stays out of this
# group (a shared group can cancel a pending release), relying on the retry in the tests
# for the rarer CI-vs-Publish overlap.
concurrency:
  group: szamlazz-live-api-ci
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
