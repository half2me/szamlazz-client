name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The test suite hits the shared szamlazz.hu demo account, which rejects concurrent
# invoice creation (error 468). Serialize across CI and Publish via a shared group so
# our own jobs never run the live tests at the same time.
concurrency:
  group: szamlazz-live-api
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
