name: Publish

on:
  push:
    tags:
      - "v*"

# The test suite hits the shared szamlazz.hu demo account, which rejects concurrent
# invoice creation (error 468). Serialize across CI and Publish via a shared group so
# our own jobs never run the live tests at the same time. Publishing is never cancelled.
concurrency:
  group: szamlazz-live-api
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - name: Set version from tag
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: pnpm build
      - run: pnpm test
      - name: Publish to NPM
        run: pnpm publish --access public --no-git-checks --provenance
